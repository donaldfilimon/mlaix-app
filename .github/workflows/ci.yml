name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Swift 6.2 toolchain
        run: |
          if [ -d "/Library/Developer/Toolchains/swift-6.2-RELEASE.xctoolchain" ]; then
            sudo xcode-select -s /Library/Developer/Toolchains/swift-6.2-RELEASE.xctoolchain
          fi
          swift --version

      - name: Build MLAIX (macOS)
        run: swift build -c release --product MLAIX --no-static-swift-stdlib

      - name: Build MLAIXiOS
        run: swift build --product MLAIXiOS --no-static-swift-stdlib

      - name: Build MLAIXtvos
        run: swift build --product MLAIXtvos --no-static-swift-stdlib

      - name: Build MLAIXWatch
        run: swift build --product MLAIXWatch --no-static-swift-stdlib

      - name: Test
        run: swift test
